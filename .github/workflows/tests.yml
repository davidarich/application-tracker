# Lint, type-check and test on every push and pull request. The tests run on
# SQLite and PostgreSQL, on Python 3.13 (the Docker image's) and 3.15.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Ruff and basedpyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: basedpyright
        run: .venv/bin/basedpyright

  tests:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.15"]
        database: [sqlite, postgres]
    services:
      postgres:
        # No image (so no service) for the SQLite runs.
        image: ${{ matrix.database == 'postgres' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: app_tracker
          POSTGRES_PASSWORD: app_tracker
          POSTGRES_DB: app_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=app_tracker --dbname=app_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://app_tracker:app_tracker@localhost:5432/app_tracker' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test
