# The web app, the JSON API and the MCP server (for AI agents) as three
# containers. Only `web` runs migrations; `api` and `mcp` start once `web` is
# healthy.
#
# MCP clients log in through the web app (OAuth 2.0), so all three need the
# public URLs of the web app (DJANGO_OAUTH_ISSUER) and of the MCP server
# (DJANGO_MCP_RESOURCE_URL). The defaults suit this machine; set both when
# serving them under other names, e.g. behind a proxy with HTTPS.
#
# With SQLite (the default), they share the database file on the
# app-tracker-data volume (the same volume `docker run` uses in the README):
#
#   DJANGO_SECRET_KEY="<a long random string>" docker compose up -d --build
#
# SQLite is fine for these containers on one machine. With PostgreSQL, the
# `postgres` profile adds a database container (data on the app-tracker-pg
# volume). Set its password, and the URL the containers connect with:
#
#   DJANGO_SECRET_KEY="<a long random string>" \
#   POSTGRES_PASSWORD="<a password>" \
#   DJANGO_DATABASE_URL="postgres://app_tracker:<the password>@db:5432/app_tracker" \
#   docker compose --profile postgres up -d --build
#
# To use a PostgreSQL server elsewhere (e.g. a managed one), set only
# DJANGO_DATABASE_URL, to that server, and leave out the profile.
# Uploaded files stay on the app-tracker-data volume either way.

services:
  web:
    build:
      context: .
      target: web
    image: app-tracker
    ports:
      - "8000:8000"
    environment: &environment
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_DATABASE_URL: ${DJANGO_DATABASE_URL:-}  # empty: SQLite
      DJANGO_OAUTH_ISSUER: ${DJANGO_OAUTH_ISSUER:-http://localhost:8000}
      DJANGO_MCP_RESOURCE_URL: ${DJANGO_MCP_RESOURCE_URL:-http://localhost:8002/mcp}
      # Reverse proxies in front of the containers (for rate limits).
      DJANGO_TRUSTED_PROXY_COUNT: ${DJANGO_TRUSTED_PROXY_COUNT:-0}
    volumes:
      - app-tracker-data:/app/data
    depends_on:
      db:
        condition: service_healthy
        required: false  # only with the postgres profile
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login/')
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    image: app-tracker-api
    ports:
      - "8001:8001"
    environment: *environment
    volumes:
      - app-tracker-data:/app/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build:
      context: .
      target: mcp
    image: app-tracker-mcp
    ports:
      - "8002:8002"
    environment:
      <<: *environment
      # Browser origins allowed to call the MCP server (comma-separated), for
      # web-based MCP clients; apps that aren't browsers need none.
      DJANGO_MCP_ALLOWED_ORIGINS: ${DJANGO_MCP_ALLOWED_ORIGINS:-}
    volumes:
      - app-tracker-data:/app/data
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz')
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:17
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: app_tracker
      POSTGRES_DB: app_tracker
      # Required: the database refuses to start without a password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - app-tracker-pg:/var/lib/postgresql/data
    # Not published on the host: only the app's containers reach it.
    healthcheck:
      test: ["CMD", "pg_isready", "--username=app_tracker", "--dbname=app_tracker"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  app-tracker-data:
    name: app-tracker-data
  app-tracker-pg:
    name: app-tracker-pg
