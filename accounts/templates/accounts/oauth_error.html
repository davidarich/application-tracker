{% extends "base.html" %}

{% block title %}Can't connect the app · Job Tracker{% endblock %}

{% block body %}
<div class="relative isolate grid min-h-full place-items-center overflow-hidden px-4 py-12">
  <div class="w-full max-w-md">
    <p class="mb-8 text-center text-3xl font-bold tracking-[0.2em] text-ink">JOB TRACKER</p>

    <div class="rounded-3xl border border-line bg-panel/80 p-8 shadow-2xl shadow-black/50 backdrop-blur" role="alert">
      <h1 class="text-2xl font-semibold tracking-tight">Can't connect the app</h1>
      <p class="mt-2 text-sm text-ink-muted">{{ description }}</p>
      <p class="mt-4 text-sm text-ink-muted">Try connecting again from the app. If it keeps happening, the app may be set up wrongly.</p>
      <a href="{% url 'tracker:dashboard' %}" class="mt-6 inline-block text-sm text-ink underline underline-offset-2">Back to Job Tracker</a>
    </div>
  </div>
</div>
{% endblock %}
